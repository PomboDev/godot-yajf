<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;family=Nunito:wght@700&amp;display=swap');</style>
    <radialGradient id="pulp" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFB627"/>
    </radialGradient>
  </defs>

  <!-- citrus slice mark -->
  <g transform="translate(110 110)">
    <circle r="82" fill="#FF7A1A"/>
    <circle r="70" fill="#FFF4D6"/>
    <circle r="62" fill="url(#pulp)"/>
    <g fill="#FFF4D6">
      <rect x="-3" y="-62" width="6" height="124" rx="3"/>
      <rect x="-3" y="-62" width="6" height="124" rx="3" transform="rotate(45)"/>
      <rect x="-3" y="-62" width="6" height="124" rx="3" transform="rotate(90)"/>
      <rect x="-3" y="-62" width="6" height="124" rx="3" transform="rotate(135)"/>
    </g>
    <circle r="9" fill="#FFF4D6"/>
    <!-- juice drop popping off -->
    <path d="M62 -78 C 72 -62, 80 -54, 80 -44 A 18 18 0 0 1 44 -44 C 44 -54, 52 -62, 62 -78 Z"
          fill="#FF7A1A" stroke="#FFF4D6" stroke-width="5"/>
    <!-- motion ticks -->
    <g stroke="#FF7A1A" stroke-width="6" stroke-linecap="round">
      <line x1="94" y1="-74" x2="108" y2="-84"/>
      <line x1="100" y1="-52" x2="116" y2="-54"/>
    </g>
  </g>

  <text x="232" y="128" font-family="Fredoka, 'Arial Rounded MT Bold', sans-serif" font-weight="700"
        font-size="104" fill="#2B1B3D" letter-spacing="2">YAJF</text>
  <text x="236" y="170" font-family="Nunito, sans-serif" font-weight="700" font-size="22"
        fill="#FF7A1A" letter-spacing="1.5">YET ANOTHER JUICE FRAMEWORK</text>
</svg>
